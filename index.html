<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Mario Platformer</title>
    <link rel="stylesheet" href="style.css">
    <style>.hidden { display: none !important; }</style>
</head>
<body>
    <div id="gameContainer" style="position: relative; width: 800px; height: 450px; margin: 40px auto;">
        <canvas id="gameCanvas" width="800" height="450" style="display: block; border: 2px solid #334155; border-radius: 8px;"></canvas>

        <!-- Màn hình Bắt đầu -->
        <div id="startScreen" style="position: absolute; inset: 0; background: rgba(15, 23, 42, 0.88); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; text-align: center;">
            <h1 style="font-size: 36px; margin-bottom: 10px; color: #facc15;">2D MARIO PLATFORMER</h1>
            <p style="margin-bottom: 20px; color: #cbd5e1;">A / D: Di chuyển | W / Space: Nhảy | S: Cúi | F: Chưởng Lửa | B: Cửa Hàng</p>
            <button onclick="startGame()" style="padding: 12px 28px; font-size: 18px; font-weight: bold; background: #22c55e; color: #fff; border: none; border-radius: 6px; cursor: pointer;">BẮT ĐẦU CHƠI</button>
        </div>

        <!-- Màn hình Cửa Hàng (Phím B) -->
        <div id="shopScreen" class="hidden" style="position: absolute; inset: 0; background: rgba(15, 23, 42, 0.92); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; text-align: center;">
            <h2 style="font-size: 28px; color: #facc15; margin-bottom: 8px;">CỬA HÀNG NÂNG CẤP</h2>
            <p id="shopCoins" style="font-size: 18px; color: #fde047; margin-bottom: 20px;">Vàng hiện có: 0</p>
            <div style="display: flex; gap: 16px; margin-bottom: 24px;">
                <button onclick="buyItem('heal')" style="padding: 12px 20px; background: #16a34a; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                    Hồi +30 HP (5 Vàng)
                </button>
                <button onclick="buyItem('upgrade')" style="padding: 12px 20px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;">
                    Tăng +15 Sát Thương (20 Vàng)
                </button>
            </div>
            <button onclick="toggleShop()" style="padding: 8px 20px; background: #64748b; color: #fff; border: none; border-radius: 6px; cursor: pointer;">Đóng (B)</button>
        </div>

        <!-- Màn hình Thua cuộc -->
        <div id="gameOverScreen" class="hidden" style="position: absolute; inset: 0; background: rgba(127, 29, 29, 0.92); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; text-align: center;">
            <h2 style="font-size: 36px; margin-bottom: 10px;">GAME OVER</h2>
            <p id="finalScore" style="font-size: 20px; margin-bottom: 20px;">Score: 0</p>
            <button onclick="location.reload()" style="padding: 12px 24px; font-size: 16px; font-weight: bold; background: #ef4444; color: #fff; border: none; border-radius: 6px; cursor: pointer;">CHƠI LẠI</button>
        </div>

        <!-- Màn hình Chiến thắng -->
        <div id="victoryScreen" class="hidden" style="position: absolute; inset: 0; background: rgba(6, 78, 59, 0.92); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 8px; text-align: center; padding: 20px;">
            <h2 style="font-size: 34px; color: #fde047; margin-bottom: 12px;">CHIẾN THẮNG!</h2>
            <p id="victoryScore" style="font-size: 18px; white-space: pre-line; margin-bottom: 20px;"></p>
            <button onclick="location.reload()" style="padding: 12px 24px; font-size: 16px; font-weight: bold; background: #22c55e; color: #fff; border: none; border-radius: 6px; cursor: pointer;">CHƠI LẠI TỪ ĐẦU</button>
        </div>
    </div>

    <script src="Platform.js"></script>
    <script src="Arrow.js"></script>
    <script src="Enemy.js"></script>
    <script src="Player.js"></script>
    <script src="main.js"></script>
</body>
</html>
