<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>2D Mario Platformer 6.0 - 5 JS Files Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas" width="800" height="450"></canvas>

    <!-- Start Overlay Screen -->
    <div id="startScreen" class="overlay">
        <h1 style="color: #facc15; font-size: 26px; margin-bottom: 10px;">MARIO PLATFORMER 6.0 - CỨU CÔNG CHÚA</h1>
        <p style="margin-bottom: 6px;">Nhảy / Nhảy đôi: <b>W / Space (Nhấn 2 lần)</b> | Hạ người: <b>S</b></p>
        <p style="margin-bottom: 6px;">Chưởng Cầu Lửa Nộ: <b>F (Thanh Nộ hồi 10s)</b> | Mở Shop: <b>B</b></p>
        <p style="color: #38bdf8; margin-top: 8px;">💡 Mẹo: Bấm S cúi người né Dơi bay sà thấp & Xung Kích Boss!</p>
        <button onclick="startGame()" style="margin-top: 15px;">BẮT ĐẦU CHƠI</button>
    </div>
</div>

<!-- Load các file JS trực tiếp không qua thư mục js/ -->
<script src="Platform.js"></script>
<script src="Arrow.js"></script>
<script src="Player.js"></script>
<script src="Enemy.js"></script>
<script src="main.js"></script>

</body>
</html>
