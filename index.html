<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Mario Action</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0d1321;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }
    #game-container {
      position: relative;
      border: 3px solid #334155;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    canvas {
      display: block;
      background-color: #29b6f6;
      outline: none;
    }
    /* Shop & Overlay Modal */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(13, 19, 33, 0.85);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    #overlay h2 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #facc15;
    }
    #overlay p {
      font-size: 16px;
      margin-bottom: 20px;
      color: #cbd5e1;
    }
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 20px;
      width: 90%;
      max-width: 650px;
    }
    .shop-item {
      background: #1e293b;
      border: 2px solid #475569;
      border-radius: 8px;
      padding: 14px;
      cursor: pointer;
      transition: 0.15s;
    }
    .shop-item:hover {
      border-color: #facc15;
      transform: translateY(-2px);
    }
    .shop-item h3 {
      font-size: 16px;
      color: #38bdf8;
      margin-bottom: 6px;
    }
    .shop-item span {
      display: inline-block;
      margin-top: 8px;
      font-weight: bold;
      color: #facc15;
    }
    .btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>
  <div id="game-container">
    <canvas id="gameCanvas" width="960" height="500" tabindex="0"></canvas>
    <div id="overlay"></div>
  </div>

    canvas.addEventListener('click', () => canvas.focus());

    const keys = {};
    window.addEventListener('keydown', (e) => {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) {
        e.preventDefault();
      }
      keys[e.code] = true;

      if (e.code === 'KeyB' && gameState === 'PLAYING') {
        toggleShop();
      } else if (e.code === 'KeyB' && gameState === 'SHOP') {
        closeOverlay();
      }

      if (e.code === 'KeyF' && gameState === 'PLAYING') {
        shootFireball();
      }
    });

    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });
